[project]
name = "aus-gdp-nowcast"
version = "0.1.0"
description = "Point-in-time nowcasting of Australian quarterly GDP growth"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "readabs>=0.2.2",
    "pandas-datareader>=0.10",
    "jupyter>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ausgdp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 95
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
